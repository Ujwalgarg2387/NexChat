# Server
server.port=${SERVER_PORT:8080}
spring.application.name=nexchat

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexchat}
spring.data.mongodb.database=${MONGODB_DATABASE:nexchat}

# JWT
jwt.secret=${JWT_SECRET:nexchat-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
file.upload-dir=${FILE_UPLOAD_DIR:src/main/resources/static/uploads}

# Encryption
encryption.key=${ENCRYPTION_KEY:nexchat-aes-encryption-key-32bytes!}
encryption.algorithm=AES/GCM/NoPadding

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# MongoDB auto-index creation (required for @Indexed annotations like unique email)
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.com.nexchat=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=INFO
